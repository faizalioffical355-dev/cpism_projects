<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container
        {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 250px;
        }
        form{
            width: 25%;
            height: auto;
            box-shadow: 0px 10px 10px 0px gray ;
            padding: 50px;
        }
        input::placeholder{
            color: green;
        }
    </style>
</head>
<body>
    
<div class="container">
  <form>
        <h1>REGISTER FORM</h1>
        <label>NAME</label>
        <input type="text" placeholder="ENTER YOUR NAME">
        <br><br>
        <label>EMAIL</label>
        <input type="email" placeholder="ENTER YOUR EMAIL">
        <br><br>
        <label>Password</label>
        <input type="password" placeholder="ENTER YOUR PASS">
    </form>
</div>
  
</body>
</html>
